[build]
  base = "client"
  command = "npm ci && npm run build"
  publish = "dist"

# Proxy API to Render (MUST be ABOVE SPA fallback)
[[redirects]]
  from = "/api/*"
  to = "https://healthmeweb-2.onrender.com/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
