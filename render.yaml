services:
  - type: web
    name: healthme-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build && echo "--- ls dist ---" && ls -la dist
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_API_KEY
        sync: false
      - key: NODE_VERSION
        value: 20
    healthCheckPath: /health
    autoDeploy: true
