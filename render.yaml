services:
  - type: web
    name: healthme-backend
    env: node
    plan: free
    buildCommand: cd server && npm ci && npm run build
    startCommand: cd server && npm run start
    rootDir: server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true
