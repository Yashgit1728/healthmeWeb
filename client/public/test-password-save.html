<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Password Save</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
        }
        form {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h2>Test Password Save</h2>
    <p>This is a simple test form to check if the browser offers to save passwords.</p>
    
    <form method="post" action="/test-login" autoComplete="on">
        <label for="username">Email:</label>
        <input 
            type="email" 
            id="username" 
            name="username" 
            autoComplete="username"
            placeholder="test@example.com"
            required
        />
        
        <label for="password">Password:</label>
        <input 
            type="password" 
            id="password" 
            name="password" 
            autoComplete="current-password"
            placeholder="password123"
            required
        />
        
        <button type="submit">Sign In (Test)</button>
    </form>
    
    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Form submitted! Check if browser offered to save password.');
            
            // Simulate successful login
            setTimeout(() => {
                window.location.href = '/';
            }, 1000);
        });
    </script>
</body>
</html>
